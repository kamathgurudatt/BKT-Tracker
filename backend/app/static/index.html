<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blinkit Stock Sentinel Web</title>
  <style>
    body { font-family: Inter, system-ui, Arial; margin: 0; background: #f6f8fb; color: #111; }
    header { background: #0f9d58; color: white; padding: 14px 18px; font-weight: 700; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    input, select, button { padding: 8px; border-radius: 8px; border: 1px solid #cfd6e4; }
    button { background: #0f9d58; color: white; border: none; cursor: pointer; }
    .row { display:flex; gap:8px; flex-wrap: wrap; align-items:center; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    .muted { color:#6b7280; font-size: 13px; }
  </style>
</head>
<body>
<header>Blinkit Stock Sentinel — Laptop Web Console</header>
<div class="container">
  <section class="card">
    <h3>Backend Connection</h3>
    <div class="row">
      <input id="baseUrl" style="min-width:420px" placeholder="https://your-backend.example.com/api/v1" />
      <button onclick="verifyUser()">Verify /auth/me</button>
    </div>
    <p id="meResult" class="muted">Not connected.</p>
  </section>

  <section class="card">
    <h3>Locations</h3>
    <div class="row">
      <input id="locationName" placeholder="Location name" />
      <input id="locationPin" placeholder="Pincode (optional)" />
      <button onclick="createLocation()">Add Location</button>
      <button onclick="loadLocations()">Refresh</button>
    </div>
    <ul id="locationsList"></ul>
  </section>

  <section class="card">
    <h3>Wishlists</h3>
    <div class="row">
      <input id="wishlistName" placeholder="Wishlist name" />
      <button onclick="createWishlist()">Create Wishlist</button>
      <button onclick="loadWishlists()">Refresh</button>
    </div>
    <ul id="wishlistsList"></ul>
  </section>

  <section class="card">
    <h3>Product Search & Track</h3>
    <div class="row">
      <input id="searchQuery" placeholder="Search product" />
      <select id="locationSelect"><option value="">All/default</option></select>
      <button onclick="searchProducts()">Search</button>
    </div>
    <ul id="searchResults"></ul>
  </section>
</div>
<script>
let locations = [];
let wishlists = [];
function base() { return document.getElementById('baseUrl').value.trim().replace(/\/$/, ''); }
async function call(path, opts={}) {
  const r = await fetch(base()+path, {headers:{'Content-Type':'application/json'}, ...opts});
  const t = await r.text(); let j; try{ j=JSON.parse(t);}catch{j={detail:t}};
  if(!r.ok) throw new Error(j.detail || `HTTP ${r.status}`); return j;
}
async function verifyUser(){ try{ const me=await call('/auth/me'); document.getElementById('meResult').innerText=`Connected as ${me.email} (${me.role})`; await loadLocations(); await loadWishlists(); }catch(e){document.getElementById('meResult').innerText=e.message;} }
async function loadLocations(){ try{ locations=await call('/locations'); const ul=document.getElementById('locationsList'); const sel=document.getElementById('locationSelect'); ul.innerHTML=''; sel.innerHTML='<option value="">All/default</option>'; locations.forEach(l=>{ ul.innerHTML += `<li>${l.id}: ${l.name} (${l.pincode || '-'})</li>`; sel.innerHTML += `<option value="${l.id}">${l.name}</option>`;}); }catch(e){ alert(e.message);} }
async function createLocation(){ try{ await call('/locations',{method:'POST', body:JSON.stringify({name:locationName.value, pincode:locationPin.value||null})}); locationName.value=''; locationPin.value=''; await loadLocations(); }catch(e){ alert(e.message);} }
async function loadWishlists(){ try{ wishlists=await call('/wishlists'); const ul=document.getElementById('wishlistsList'); ul.innerHTML=''; wishlists.forEach(w=> ul.innerHTML += `<li>${w.id}: ${w.name}</li>`);}catch(e){ alert(e.message);} }
async function createWishlist(){ try{ await call('/wishlists',{method:'POST', body:JSON.stringify({name:wishlistName.value})}); wishlistName.value=''; await loadWishlists(); }catch(e){ alert(e.message);} }
async function searchProducts(){
  try{
    const q=encodeURIComponent(document.getElementById('searchQuery').value.trim());
    const loc=document.getElementById('locationSelect').value;
    const path='/tracking/search?q='+q+(loc?`&location_id=${loc}`:'');
    const results=await call(path);
    const ul=document.getElementById('searchResults'); ul.innerHTML='';
    results.forEach(p=>{
      const li=document.createElement('li');
      li.innerHTML = `${p.name} — ₹${p.price ?? '-'} [${p.stock_status}] <button>Track</button>`;
      li.querySelector('button').onclick=()=>trackProduct(p);
      ul.appendChild(li);
    });
  }catch(e){ alert(e.message);}
}
async function trackProduct(p){
  try{
    const all = confirm('Track across ALL saved locations?\nOK = all locations, Cancel = selected/default');
    const selectedLoc = document.getElementById('locationSelect').value;
    const location_ids = all ? locations.map(l=>l.id) : (selectedLoc ? [Number(selectedLoc)] : []);
    const wishlist_id = wishlists.length ? wishlists[0].id : null;
    await call('/tracking/items',{method:'POST',body:JSON.stringify({provider:p.provider,external_product_id:p.external_product_id,name:p.name,image_url:p.image_url,category:p.category,wishlist_id,location_ids})});
    alert('Tracking added successfully');
  }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
