name: Deploy Render
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy hook (API)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_API" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /dev/null || echo "Render API deploy hook request completed with status $?"
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      - name: Trigger Render deploy hook (Worker)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER != '' }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_WORKER" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /dev/null || echo "Render Worker deploy hook request completed with status $?"
        env:
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
