name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Ruff
        run: ruff check backend/app

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: Build installable debug APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://YOUR_BACKEND.up.railway.app/api/v1' }}
      - name: Upload Android APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: blinkit-stock-sentinel-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Add APK download link to workflow summary
        run: |
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifact: ${{ steps.upload_apk.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact name: blinkit-stock-sentinel-debug-apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mobile build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-diagnostics
          path: |
            mobile/build/**/outputs/logs/**
            mobile/android/.gradle/**/problems-report.*
            mobile/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
