services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # FIX: worker and beat are now SEPARATE containers — production-grade.
  # Beat stalling no longer blocks task execution.
  worker:
    build: ./backend
    command: >-
      celery -A app.workers.celery_app.celery_app worker
      --pool=$${CELERY_WORKER_POOL:-prefork}
      --concurrency=$${CELERY_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=$${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      --prefetch-multiplier=$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --loglevel=INFO
    env_file: .env
    environment:
      WORKER_HEALTH_PORT: "8001"
      CELERY_WORKER_POOL: "prefork"
      CELERY_WORKER_CONCURRENCY: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "25"
      CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    ports: ["8001:8001"]
    restart: unless-stopped

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
